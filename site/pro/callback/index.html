<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion en cours · placedupermis.fr</title>
<link rel="stylesheet" href="/pro/assets/style.css">
<style>
body{background:linear-gradient(175deg,var(--bg) 0%,var(--blue-bg) 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:36px 32px;text-align:center;max-width:400px;margin:20px}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#a12530;margin-top:10px}
</style>
</head><body>
<div class="box">
<h2 style="margin:0 0 6px">Connexion en cours…</h2>
<p style="color:var(--ink2);margin:0 0 8px" id="msg">Vérification du lien de connexion.</p>
<div class="spinner" id="spinner"></div>
<p class="err hidden" id="err"></p>
</div>
<script type="module">
import '/pro/assets/pdp-pro.js'

// Le SDK Supabase (createClient avec detectSessionInUrl: true) parse automatiquement
// le fragment #access_token=... ou le code ?code= présent dans l'URL de callback.
// On attend juste que la session soit disponible puis on redirige.
const returnTo = new URLSearchParams(location.search).get('return') || '/pro/mon-espace/'

async function go() {
  for (let i = 0; i < 20; i++) {  // attend jusqu'à ~4s
    const { data: { session } } = await window.pdp.sb.auth.getSession()
    if (session) { location.replace(returnTo); return }
    await new Promise(r => setTimeout(r, 200))
  }
  document.getElementById('spinner').style.display = 'none'
  document.getElementById('msg').textContent = 'Le lien est invalide ou a expiré.'
  const err = document.getElementById('err')
  err.textContent = 'Retour à la page de connexion dans 3 secondes…'
  err.classList.remove('hidden')
  setTimeout(() => location.replace('/pro/connexion/'), 3000)
}
go()
</script>
</body></html>
